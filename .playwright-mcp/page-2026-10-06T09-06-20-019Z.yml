              - listitem [ref=f1e446]: Review the scan results to confirm what will be removed.
              - listitem [ref=f1e447]: Download a clean copy with no EXIF, GPS, or XMP data.
            - paragraph [ref=f1e448]: Your images are processed locally on your device and are never uploaded to a server, so the original never leaves your computer or phone.
            - heading "The bottom line" [level=4] [ref=f1e449]
            - paragraph [ref=f1e450]: Photo metadata is a hidden record of how, when, and where every image was made. Most of it is useful, but the location and timestamp fields can quietly leak more than you intend. Knowing what is stored inside your photos — and cleaning them before you share — is one of the simplest and most effective privacy habits you can adopt.
