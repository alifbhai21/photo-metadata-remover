            - paragraph [ref=f1e581]: This works well for JPG on stock installs, but keep in mind it is format-dependent and does not alter the photo pixels. For other formats or a more predictable result, use a dedicated stripper.
            - heading "Removing EXIF on macOS" [level=4] [ref=f1e582]
