        - article [ref=f1e372]:
          - heading "What Is Photo Metadata? The Complete Guide to Hidden Image Data" [level=3] [ref=f1e373]
          - paragraph [ref=f1e374]:
            - text: Updated
            - time [ref=f1e375]: August 15, 2026
          - generic [ref=f1e376]:
            - paragraph [ref=f1e377]:
              - text: "Every digital photo is actually two files bundled into one. The first is the image you see: the pixels, colors, and composition. The second is a block of hidden data called"
              - strong [ref=f1e378]: photo metadata
              - text: — technical information that records how, when, and often where the picture was taken. It is invisible in the image itself, but it is stored inside every photo you take and often inside every photo you receive.
            - paragraph [ref=f1e379]: This guide explains what photo metadata is, what kinds exist, what information it can reveal, and how to strip it from your images before you share them.
            - heading "What is photo metadata?" [level=4] [ref=f1e380]
            - paragraph [ref=f1e381]: "Photo metadata is structured information embedded inside an image file. When a camera or smartphone captures a frame, it writes a series of fields alongside the pixel data: the make and model of the camera, the exposure settings, the date and time, and in many cases the GPS coordinates of the shot."
            - paragraph [ref=f1e382]: Because this data is stored inside the file, it travels with the image wherever it goes. Renaming a file, moving it to a new folder, or sending it as an attachment does nothing to remove it.
            - heading "The three main types of photo metadata" [level=4] [ref=f1e383]
            - paragraph [ref=f1e384]: "There are three standards that cover most of the metadata found in modern photos:"
            - list [ref=f1e385]:
              - listitem [ref=f1e386]:
                - strong [ref=f1e387]: EXIF
                - text: "— the Exchangeable Image File Format. This block holds camera and technical data: make, model, lens, aperture, shutter speed, ISO, focal length, orientation, flash, and timestamps."
              - listitem [ref=f1e388]:
                - strong [ref=f1e389]: IPTC
                - text: — originally developed for news agencies, this standard stores descriptive information such as captions, keywords, bylines, and copyright.
              - listitem [ref=f1e390]:
                - strong [ref=f1e391]: XMP
                - text: — the Extensible Metadata Platform, an Adobe-created XML standard now used across many applications. It can combine technical and descriptive fields and is often the container where modern editors write data.
            - paragraph [ref=f1e392]: The words “photo metadata” usually mean the combined set of all three.
            - heading "What information hides inside a photo?" [level=4] [ref=f1e393]
            - paragraph [ref=f1e394]: "The exact fields depend on the device and software, but a typical photo contains some or all of the following:"
            - list [ref=f1e395]:
              - listitem [ref=f1e396]:
                - strong [ref=f1e397]: Camera make and model
                - text: — the specific device used for the shot.
              - listitem [ref=f1e398]:
                - strong [ref=f1e399]: Lens details
                - text: — focal length, aperture, and the lens model if it is exchangeable.
              - listitem [ref=f1e400]:
                - strong [ref=f1e401]: Exposure settings
                - text: — shutter speed, ISO, and metering mode.
              - listitem [ref=f1e402]:
                - strong [ref=f1e403]: Date and time
                - text: — often accurate to the second.
              - listitem [ref=f1e404]:
                - strong [ref=f1e405]: GPS coordinates
                - text: — latitude and longitude, recorded when location services are active.
              - listitem [ref=f1e406]:
                - strong [ref=f1e407]: Orientation
                - text: — how the camera was held, used to display the image upright.
              - listitem [ref=f1e408]:
                - strong [ref=f1e409]: Software and editing history
                - text: — the application that created or modified the file, sometimes including a profile or username.
              - listitem [ref=f1e410]:
                - strong [ref=f1e411]: Embedded thumbnail
                - text: — a small preview stored inside the file that can survive certain editing operations.
            - paragraph [ref=f1e412]: None of this is visible on screen, which is why the majority of people never realise it is there.
            - heading "How does metadata get into a photo?" [level=4] [ref=f1e413]
            - paragraph [ref=f1e414]: Cameras and phones add metadata automatically at the moment of capture. Smartphone location metadata appears only when the camera app has permission to use GPS, but the rest — model, settings, timestamp — is written automatically every time.
            - paragraph [ref=f1e415]: Photo-editing software can then rewrite or extend these blocks. Cropping, color grading, and format conversion frequently preserve most of the original metadata and add their own tag for the software used. Some applications even embed a copy of the owner’s name in the metadata of purchased templates or edited files.
            - heading "Why photo metadata matters for privacy" [level=4] [ref=f1e416]
            - paragraph [ref=f1e417]:
              - text: "Most metadata is harmless, but two fields deserve special attention:"
              - strong [ref=f1e418]: GPS coordinates
              - text: and
              - strong [ref=f1e419]: timestamps
              - text: .
            - paragraph [ref=f1e420]:
              - text: If you take a photo at home and share the untouched file, the embedded location can point at your address. Timestamps tell people
              - emphasis [ref=f1e421]: when
              - text: you were there. Taken together, they can reveal a great deal about your routine, and they make targeted social engineering easier. This is why security-conscious photographers and privacy guides almost always recommend cleaning metadata before publishing images.
            - paragraph [ref=f1e422]: It is worth being precise about the risk. Metadata removal reduces exposure, but it does not make you anonymous on its own. Platforms you upload to may add their own metadata, and other clues in the image content itself can still reveal location. Treat metadata removal as one layer of privacy hygiene, not a magic guarantee.
            - heading "When is metadata removed automatically?" [level=4] [ref=f1e423]
            - paragraph [ref=f1e424]: "Some channels strip metadata for you, and many do not:"
            - list [ref=f1e425]:
              - listitem [ref=f1e426]:
                - strong [ref=f1e427]: Message apps
                - text: — behavior varies. Some remove EXIF, others preserve it for hours until you share a “compressed” copy. Never assume.
              - listitem [ref=f1e428]:
                - strong [ref=f1e429]: Social platforms
                - text: — most social networks re-encode uploads and usually drop the original EXIF/GPS block, but the safest assumption is that nothing is guaranteed.
              - listitem [ref=f1e430]:
                - strong [ref=f1e431]: Email and file transfer
                - text: — sending the original file preserves everything.
              - listitem [ref=f1e432]:
                - strong [ref=f1e433]: Screenshots
                - text: — a screenshot carries none of the source camera metadata, only the screen’s own details.
            - paragraph [ref=f1e434]: Because behavior varies so widely, the reliable approach is to remove the metadata yourself before you send the file anywhere.
            - heading "How to check what your photo contains" [level=4] [ref=f1e435]
            - paragraph [ref=f1e436]: "Before sharing, it takes only seconds to see what is inside:"
            - list [ref=f1e437]:
              - listitem [ref=f1e438]: Open the file in a metadata viewer — the page you are on now offers the free metadata checker.
              - listitem [ref=f1e439]: "Review the detected fields: camera, software, timestamps, and any GPS coordinates."
              - listitem [ref=f1e440]: Decide whether to share the file as-is or clean it first.
            - heading "How to remove photo metadata" [level=4] [ref=f1e441]
            - paragraph [ref=f1e442]:
              - text: The most reliable way to remove metadata is to rewrite the file without the hidden blocks. The free
              - link "photo metadata remover" [ref=f1e443] [cursor=pointer]:
