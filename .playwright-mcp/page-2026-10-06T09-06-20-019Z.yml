          - generic [ref=f1e468]:
            - paragraph [ref=f1e469]: "Every photo is two files: the pixels you see and the metadata you do not. Hidden in the bytes are the camera that took the shot, the exact moment of capture, the coordinates of where you stood, and the chain of software that touched the result. This guide breaks down every category of hidden data — what each field is, what it reveals, and what it means for your privacy."
            - 'heading "EXIF: the technical record" [level=4] [ref=f1e470]'
            - paragraph [ref=f1e471]: EXIF (Exchangeable Image File) is the largest block of hidden data, written by the camera at the moment of capture.
            - list [ref=f1e472]:
              - listitem [ref=f1e473]:
                - strong [ref=f1e474]: Camera identity
                - text: — make, model, and (in some files) serial-derived identifiers that are unique to your device.
              - listitem [ref=f1e475]:
                - strong [ref=f1e476]: Capture settings
                - text: — aperture, shutter speed, ISO, exposure compensation, focal length, and metering mode.
              - listitem [ref=f1e477]:
                - strong [ref=f1e478]: Timestamps
                - text: — the exact date and time the photo was taken.
              - listitem [ref=f1e479]:
                - strong [ref=f1e480]: Lens and flash data
                - text: — what glass you used and whether flash fired.
              - listitem [ref=f1e481]:
                - strong [ref=f1e482]: Orientation and color info
                - text: — how the image should be displayed and its color matrix.
            - paragraph [ref=f1e483]: When someone reads EXIF, they can often identify your exact camera, your editing history, and exactly when you pressed the shutter.
            - 'heading "GPS: where you were" [level=4] [ref=f1e484]'
            - paragraph [ref=f1e485]: GPS fields store the coordinates recorded by your phone or camera-shutter location.
            - list [ref=f1e486]:
              - listitem [ref=f1e487]:
                - strong [ref=f1e488]: Latitude and longitude
                - text: — precise to within metres of where you stood.
              - listitem [ref=f1e489]:
                - strong [ref=f1e490]: Altitude and heading
                - text: — how high you were and your direction of travel.
              - listitem [ref=f1e491]:
                - strong [ref=f1e492]: Geotags in platform copies
                - text: — some apps re-add where-you-were labels that sit side-by-side with the raw fields.
            - paragraph [ref=f1e493]: Coordinates alone are a pinpoint. Combined with the timestamp, they place you at a specific place at a specific moment.
            - 'heading "IPTC and XMP: editorial and workflow data" [level=4] [ref=f1e494]'
            - paragraph [ref=f1e495]: IPTC and XMP are second containers used by photographers, editors, and content platforms.
            - list [ref=f1e496]:
              - listitem [ref=f1e497]:
                - strong [ref=f1e498]: IPTC
                - text: — headline, caption, creator, copyright, keywords, and location fields entered by people.
              - listitem [ref=f1e499]:
                - strong [ref=f1e500]: XMP
                - text: — the modern standard that carries equivalent fields plus workflow state, edit history, and rating.
              - listitem [ref=f1e501]:
                - strong [ref=f1e502]: Creator rights
                - text: — names, e-mails, and agency contact details are common here.
            - paragraph [ref=f1e503]: For personal photos these boxes are usually empty, but a copied template or an editing suite can fill them without you noticing.
            - heading "Software trails and thumbnails" [level=4] [ref=f1e504]
            - paragraph [ref=f1e505]: The hidden data does not stop at the registered fields.
            - list [ref=f1e506]:
              - listitem [ref=f1e507]:
                - strong [ref=f1e508]: Software tags
                - text: — every editor writes its name and version; the most recent one usually wins, but history often remains readable.
              - listitem [ref=f1e509]:
                - strong [ref=f1e510]: Embedded thumbnails
                - text: — a small preview inside the file (for example, inside EXIF sub-blocks) that survives in some tools when the main image is cleared.
              - listitem [ref=f1e511]:
                - strong [ref=f1e512]: Hidden previews in proprietary formats
                - text: — RAW, HEIC, and PNG can carry extra structures beyond the visible frame.
            - paragraph [ref=f1e513]: These trails tell a viewer which programs you used and can survive partial cleaning.
            - heading "Why hidden data matters to you" [level=4] [ref=f1e514]
            - paragraph [ref=f1e515]: "Each category is useful — and each is a risk in the wrong hands:"
            - list [ref=f1e516]:
              - listitem [ref=f1e517]:
                - strong [ref=f1e518]: Identity
                - text: — camera serial-derived fields and software tags narrow who you are.
              - listitem [ref=f1e519]:
                - strong [ref=f1e520]: Physical safety
                - text: — GPS plus timestamps reveal routines, homes, and workplaces.
              - listitem [ref=f1e521]:
                - strong [ref=f1e522]: Social engineering
                - text: — editing history is perfect material for targeted manipulation.
              - listitem [ref=f1e523]:
                - strong [ref=f1e524]: Unexpected exposure
                - text: — metadata rides along silently in every email, forum post, and marketplace listing.
            - paragraph [ref=f1e525]: The risk is not that one field is dangerous; it is the combination of location, time, identity, and behavior in a single small file.
            - heading "How to find what is hidden in a photo" [level=4] [ref=f1e526]
            - list [ref=f1e527]:
              - listitem [ref=f1e528]:
                - strong [ref=f1e529]: Scan
