          - generic [ref=f1e557]:
            - paragraph [ref=f1e558]: "Every photo you take with a phone or camera carries a hidden trailer: EXIF data documenting the camera model, exposure settings, the exact moment it was shot and — whenever permission allowed — the GPS coordinates. This guide shows every practical way to remove EXIF data for free, on any device, so the files you share stop leaking details about you and your equipment."
            - heading "First, confirm the EXIF is actually there" [level=4] [ref=f1e559]
            - paragraph [ref=f1e560]: Removal you cannot verify is removal you cannot trust. Run the photo through the free photo metadata checker — it lists camera, software, timestamp, and GPS fields in seconds, all inside your browser. That glance tells you how much context the file is carrying and gives you a baseline for later verification.
