            - paragraph [ref=f1e537]: Everything runs locally in your browser; your originals never leave your device.
            - heading "The bottom line" [level=4] [ref=f1e538]
            - paragraph [ref=f1e539]: Hidden in a photo are the camera and its settings profile, the exact capture time, your coordinates, editorial names, software history, and embedded previews. Technicians use these fields to organize and verify files; strangers use them to find out who you are and where you live. Scan your files, strip the fields, and verify the result — the same way you would check a gate before leaving it unlocked.
