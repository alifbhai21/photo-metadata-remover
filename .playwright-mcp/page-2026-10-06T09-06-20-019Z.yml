              - listitem [ref=f1e597]:
                - strong [ref=f1e598]: Android (stock and most skins)
                - text: — share “without location” if your gallery offers it, otherwise strip in the browser tool.
              - listitem [ref=f1e599]:
                - strong [ref=f1e600]: Samsung / Pixel
                - text: — the gallery apps expose a “Share without location” or “Remove location” action for single images.
            - paragraph [ref=f1e601]: None of these are as thorough or predictable as a dedicated stripper, so treat the browser method as the consistent cross-device answer.
            - 'heading "Method that avoids the problem entirely: screenshots" [level=4] [ref=f1e602]'
            - paragraph [ref=f1e603]: A screenshot captures pixels, not metadata. The result carries no source EXIF or GPS. Use it for a quick, clean share — just remember the resolution now equals your screen, and the screen itself can add its own filename or tag. It is a tactical shortcut, not a metadata strategy.
            - heading "What actually gets removed" [level=4] [ref=f1e604]
            - paragraph [ref=f1e605]: "A full strip removes the informational block: camera make and model, lens and focal length, aperture, shutter speed, ISO, software and processing history, capture timestamp, and — crucially — GPS coordinates. The pixels are untouched. That means you lose nothing you would notice visually while removing the exact data that identifies you and your equipment."
            - heading "The privacy payoff" [level=4] [ref=f1e606]
            - paragraph [ref=f1e607]: Your camera’s serial-derived fields, your device type, and your captured locations are the exact ammunition used in stalking, targeted scams, and doxing. Removing EXIF before you send a file to someone — a buyer, a forum, a support chat, a dating profile — removes that ammunition with one step. And since the tool is local, there is no third-party copy of your image to worry about.
            - heading "Verify, then share" [level=4] [ref=f1e608]
            - paragraph [ref=f1e609]: "Close the loop the same way you opened it: run the output through the metadata checker and confirm the GPS and camera fields are gone. If any tag survived, the format needed the full-strip path. A verified clean file is the only file worth sharing."
            - heading "The bottom line" [level=4] [ref=f1e610]
            - paragraph [ref=f1e611]: "Removing EXIF data is free, fast, and quality-neutral: confirm it is present with a checker, strip it with a browser-based tool that never uploads your file, and verify the result before sharing. On Windows and macOS the built-in export and property paths work for simple cases; on phones a dedicated stripper is the most predictable option."
