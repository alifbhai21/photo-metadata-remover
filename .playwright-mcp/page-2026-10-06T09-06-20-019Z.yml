        - article [ref=f1e625]:
          - heading "What Is EXIF Data? Photos Carry a Hidden Camera Report" [level=3] [ref=f1e626]
          - paragraph [ref=f1e627]:
            - text: Updated
            - time [ref=f1e628]: August 18, 2026
          - generic [ref=f1e629]:
            - paragraph [ref=f1e630]:
              - text: Every photo you take carries a secret report about itself. Alongside the pixels, the file stores a block of data called
              - strong [ref=f1e631]: EXIF
              - text: ", and it records far more than most people expect: the exact camera body, the lens, the aperture and shutter speed, the second the photo was taken, and often the precise GPS location. This guide explains what EXIF data is, what it contains, how to read it, and how to strip it from your images."
            - heading "What does EXIF mean?" [level=4] [ref=f1e632]
            - paragraph [ref=f1e633]:
              - text: EXIF stands for
              - strong [ref=f1e634]: Exchangeable Image File Format
              - text: . It is a specification that camera manufacturers, smartphone makers, and photo software use to store technical and descriptive information inside an image file, usually a JPEG or TIFF.
            - paragraph [ref=f1e635]: The format was introduced in the 1990s to help cameras and printers exchange information automatically. Today it is the reason your photo management app can sort thousands of pictures by date, camera, lens, or even GPS location without you entering a single detail by hand.
            - heading "What information does EXIF actually store?" [level=4] [ref=f1e636]
            - paragraph [ref=f1e637]: "EXIF is a collection of tagged fields. A typical photo written by a modern camera contains many of the following:"
            - list [ref=f1e638]:
              - listitem [ref=f1e639]:
                - strong [ref=f1e640]: Camera make and model
                - text: — the brand and exact device, such as a specific smartphone model or camera body.
              - listitem [ref=f1e641]:
                - strong [ref=f1e642]: Lens and focal data
                - text: — the lens model, focal length, and aperture.
              - listitem [ref=f1e643]:
                - strong [ref=f1e644]: Exposure information
                - text: — shutter speed, ISO sensitivity, exposure compensation, and metering mode.
              - listitem [ref=f1e645]:
                - strong [ref=f1e646]: Flash data
                - text: — whether the flash fired and its mode.
              - listitem [ref=f1e647]:
                - strong [ref=f1e648]: Date and time
                - text: — the capture time, often to the second and sometimes including the timezone.
              - listitem [ref=f1e649]:
                - strong [ref=f1e650]: GPS coordinates
                - text: — latitude and longitude, plus sometimes altitude and direction, when location services are enabled.
              - listitem [ref=f1e651]:
                - strong [ref=f1e652]: Orientation and dimensions
                - text: — how the camera was held and the image width and height.
              - listitem [ref=f1e653]:
                - strong [ref=f1e654]: Software tag
                - text: — the application that created or last edited the file.
              - listitem [ref=f1e655]:
                - strong [ref=f1e656]: Thumbnail
                - text: — a small embedded preview.
            - paragraph [ref=f1e657]: Some cameras add even more specialist fields, such as lens serial numbers, focusing distance, or a count of how many times the shutter has been pressed.
            - heading "Why does EXIF matter for privacy?" [level=4] [ref=f1e658]
            - paragraph [ref=f1e659]:
              - text: The two fields that create most privacy concern are
              - strong [ref=f1e660]: GPS coordinates
              - text: and
              - strong [ref=f1e661]: timestamps
              - text: ":"
            - list [ref=f1e662]:
              - listitem [ref=f1e663]: A photo taken in your living room can embed your home’s coordinates, showing anyone with the file exactly where you live.
              - listitem [ref=f1e664]: Timestamps add a “when” to the “where,” letting someone map out habits, schedules, or travel patterns.
            - paragraph [ref=f1e665]: "This is not a theoretical risk. Shared photo libraries, online marketplaces, and photography forums routinely strip EXIF for exactly this reason, and journalists and activists in sensitive situations go to great lengths to remove location data before publishing. The risk is real but proportional: EXIF removal removes a specific layer of exposure, and it should be combined with sensible behavior (for example, not publishing images whose content itself reveals your address)."
            - heading "How to view EXIF data" [level=4] [ref=f1e666]
            - paragraph [ref=f1e667]: You do not need specialist knowledge to read EXIF. The quickest way is to load the photo into a viewer that exposes all tags. On this site, the free photo metadata checker lists every detectable field in seconds, entirely in your browser.
            - paragraph [ref=f1e668]: On a phone, the built-in gallery usually hides most tags, and on a desktop the operating system shows only basic fields such as date and dimensions. A dedicated viewer is the difference between seeing a summary and seeing the full report.
            - heading "Why can EXIF survive editing?" [level=4] [ref=f1e669]
            - paragraph [ref=f1e670]: Many people assume that editing a photo removes its EXIF. Usually it does not. Cropping, rotating, color correction, and converting between common formats like JPEG and WebP preserve most of the original tags, and the editor often adds a new software tag on top. Only operations that explicitly rebuild the file without metadata — like a metadata-stripping tool or saving as a “clean” export — remove it reliably.
            - heading "How to remove EXIF data" [level=4] [ref=f1e671]
            - paragraph [ref=f1e672]:
              - text: "Removing EXIF is straightforward: rewrite the file without the metadata block. The free"
              - link "photo metadata remover" [ref=f1e673] [cursor=pointer]:
                - /url: /en/#tool
              - text: "does this in a few seconds:"
            - list [ref=f1e674]:
              - listitem [ref=f1e675]: Open the tool and load your photo — everything runs locally in your browser.
              - listitem [ref=f1e676]: Review the detected fields so you know what will be gone.
              - listitem [ref=f1e677]: Download a clean copy with no EXIF, GPS, or IPTC/XMP data.
            - paragraph [ref=f1e678]: Because the processing happens on your own device, the original never leaves your computer or phone and no upload is involved.
            - heading "EXIF is only part of the story" [level=4] [ref=f1e679]
            - paragraph [ref=f1e680]:
              - text: EXIF is the best-known metadata block, but not the only one.
              - strong [ref=f1e681]: IPTC
              - text: holds descriptive fields such as keywords and copyright, and
              - strong [ref=f1e682]: XMP
              - text: is the modern XML standard that many applications write today, often duplicating EXIF values. A thorough cleaner removes all three, not just the EXIF section. Our guide on
              - link "IPTC vs XMP metadata" [ref=f1e683] [cursor=pointer]:
                - /url: /en/blog/iptc-vs-xmp-metadata-explained
              - text: covers the difference in depth.
            - heading "The bottom line" [level=4] [ref=f1e684]
            - paragraph [ref=f1e685]: EXIF is the hidden report your camera writes about every photo — and it travels with the file wherever it goes. Most of it is useful for organizing pictures, but the GPS and timestamp fields can leak details you never intended to share. Checking what a photo contains before you send it, and stripping the metadata when the content is sensitive, takes seconds and is one of the most effective privacy habits available.
            - paragraph [ref=f1e686]:
              - text: Curious what your photos hide? Check a photo now or clean it up straight away with the
              - link "photo metadata remover" [ref=f1e687] [cursor=pointer]:
                - /url: /en/#tool
              - text: .
