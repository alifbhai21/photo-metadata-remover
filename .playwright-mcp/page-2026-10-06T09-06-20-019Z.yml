              - listitem [ref=f1e589]: In the export dialog, choose a format that allows metadata removal; some builds offer a “without metadata” option or write clean output by default.
            - paragraph [ref=f1e590]: Where the export path is insufficient, the browser tool above is the more dependable route.
            - heading "Removing EXIF on iPhone and Android" [level=4] [ref=f1e591]
            - paragraph [ref=f1e592]: "Built-in stripping on phones is rare and varies by manufacturer. The options that exist:"
            - list [ref=f1e593]:
